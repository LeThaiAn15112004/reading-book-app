name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Typecheck / lint / unit tests never launch Electron — skip the ~100 MB binary download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        id: install
        run: npm ci

      # Spec 009: one install folder, one lock file, no dependency-carrying manifest outside the root.
      - name: Single install
        if: (success() || failure()) && steps.install.outcome == 'success'
        run: npm run check:single-install

      # Spec 009 (FR-018): the same checks as `npm run check`, one step each so one push reports every problem
      # (each runs even when an earlier one failed). Keep this list in step with the "check" script in package.json.
      - name: SDK · typecheck
        if: (success() || failure()) && steps.install.outcome == 'success'
        run: npm run sdk:typecheck

      - name: SDK · typecheck tests
        if: (success() || failure()) && steps.install.outcome == 'success'
        run: npm run sdk:typecheck:tests

      - name: SDK · test
        if: (success() || failure()) && steps.install.outcome == 'success'
        run: npm run sdk:test


      - name: Desktop · typecheck
        if: (success() || failure()) && steps.install.outcome == 'success'
        run: npm run desktop:typecheck

      - name: Desktop · lint
        if: (success() || failure()) && steps.install.outcome == 'success'
        run: npm run desktop:lint
      - name: Desktop · e2e typecheck (compile only)
        if: (success() || failure()) && steps.install.outcome == 'success'
        run: npm run e2e:typecheck

      - name: Mobile · typecheck host
        if: (success() || failure()) && steps.install.outcome == 'success'
        run: npm run mobile:typecheck

      - name: Mobile · typecheck web UI
        if: (success() || failure()) && steps.install.outcome == 'success'
        run: npm run mobile:typecheck:web
      - name: Mobile · lint
        if: (success() || failure()) && steps.install.outcome == 'success'
        run: npm run mobile:lint

      # Mobile stores against the Desktop data contract, on node:sqlite (spec 008, US4).
      - name: Mobile · test
        if: (success() || failure()) && steps.install.outcome == 'success'
        run: npm run mobile:test

      - name: Mobile · build web UI
        if: (success() || failure()) && steps.install.outcome == 'success'
        run: npm run build:web

      # After the web build, so the secrets check also reads the Mobile bundle (spec 008, US2).
      - name: Boundaries · import rules, graphs, secrets
        if: (success() || failure()) && steps.install.outcome == 'success'
        run: npm run check:boundaries

      - name: Platform adapters · same exports on both hosts
        if: (success() || failure()) && steps.install.outcome == 'success'
        run: npm run check:platform-adapters

      - name: Desktop · build (renderer + Main)
        if: (success() || failure()) && steps.install.outcome == 'success'
        run: npm run build

      - name: Build split · no .native in Desktop, no .electron in the WebView
        if: (success() || failure()) && steps.install.outcome == 'success'
        run: npm run check:build-split

      # electron-builder.json5 lists Main's externals; the block must be the same on every OS (spec 009 T051).
      - name: Desktop package · node_modules allowlist matches npm ls
        if: (success() || failure()) && steps.install.outcome == 'success'
        run: npm run check:package-deps
